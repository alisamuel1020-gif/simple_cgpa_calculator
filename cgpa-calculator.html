<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGPA Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #f5f7fa; color: #2d3436; padding: 20px; min-height: 100vh; }
    h1 { text-align: center; margin-bottom: 8px; color: #1a1a2e; }
    .subtitle { text-align: center; color: #636e72; margin-bottom: 30px; font-size: 0.9em; }

    .container { max-width: 720px; margin: 0 auto; }

    /* Semester cards */
    .semester {
      background: #fff; border-radius: 12px; padding: 20px;
      margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    .semester-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 8px; }
    .semester-label { font-size: 1.15em; font-weight: 700; color: #1a1a2e; }
    .add-course-btn { background: #0984e3; color: #fff; border: none; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85em; transition: background .2s; }
    .add-course-btn:hover { background: #076bbf; }
    .del-semester-btn { background: #e17055; color: #fff; border: none; padding: 7px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85em; }
    .del-semester-btn:hover { background: #d63031; }

    .grade-scale { font-size: 0.8em; color: #636e72; margin-bottom: 15px; display: flex; gap: 18px; flex-wrap: wrap; }
    .grade-point { font-weight: 700; color: #0984e3; }

    /* Course table */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 0.9em; }
    th { color: #636e72; font-weight: 600; font-size: 0.82em; text-transform: uppercase; letter-spacing: .5px; }
    tr:hover { background: #fafafa; }

    td input, td select { border: 1px solid #ddd; border-radius: 6px; padding: 6px 10px; font-size: 0.9em; outline: none; transition: border .2s; width: 100%; }
    td input:focus, td select:focus { border-color: #0984e3; }
    td select option { color: #2d3436; }

    .delete-course { background: none; border: none; color: #d63031; cursor: pointer; font-size: 1.3em; line-height: 1; padding: 2px 6px; border-radius: 4px; }
    .delete-course:hover { background: #ffeaea; }

    .stats-bar { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { flex: 1; min-width: 140px; background: #fff; border-radius: 10px; padding: 15px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .stat-card .label { font-size: 0.75em; color: #636e72; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
    .stat-card .value { font-size: 1.8em; font-weight: 800; color: #1a1a2e; }
    .stat-card .sub { font-size: 0.75em; color: #b2bec3; }

    /* Summary card */
    .summary { background: linear-gradient(135deg, #0984e3, #6c5ce7); border-radius: 12px; padding: 30px; margin-top: 10px; color: #fff; }
    .summary h2 { margin-bottom: 20px; font-size: 1.3em; }
    .summary .entry { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,.2); font-size: 0.95em; }
    .summary .entry:last-child { border-bottom: none; }
    .summary .no-courses { color: rgba(255,255,255,.5); text-align: center; }

    @media (max-width: 600px) {
      .stats-bar { flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CGPA Calculator</h1>
    <p class="subtitle">5.0 Grade Scale (A=5.0, B=4.0, C=3.0, D=2.0, E=1.0, F=0.0) — Cumulative across all semesters</p>

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="label">Credits This Semester</div>
        <div class="value" id="creditsThisSem">0</div>
        <div class="sub" id="creditsSub">credit(s)</div>
      </div>
      <div class="stat-card">
        <div class="label">Total Credits</div>
        <div class="value" id="totalCredits">0</div>
        <div class="sub" id="totalCreditsSub">credit(s)</div>
      </div>
      <div class="stat-card">
        <div class="label">CGPA</div>
        <div class="value" id="cgpaDisplay">-</div>
        <div class="sub" id="cgpaSub">GPA · 5.0 scale</div>
      </div>
    </div>

    <!-- Semester cards live here -->
    <div id="semesterContainer"></div>

    <button class="add-course-btn" onclick="addSemester()" style="display:block;margin:30px auto 10px;">+ Add Semester</button>
  </div>

  <script>
    const GRADE_POINTS = {
      'A': 5.0, 'B': 4.0, 'C': 3.0, 'D': 2.0, 'D': 1.0,'F': 0.0
    };

    // State: array of semesters.
    // Each semester = { id, index, courses: [{courseName, credits, grade}] }
    let semesters = [];
    let nextId = 1;

    function uid() { return 's' + nextId++; }

    // Recompute totals for one semester
    function recomputeSemester(sem) {
      sem.totalCredits = 0;
      sem.totalPoints = 0;
      for (const c of sem.courses) {
        const creds = c.credits || 0;
        sem.totalCredits += creds;
        sem.totalPoints += (GRADE_POINTS[c.grade] ?? 0) * creds;
      }
    }

    // Recompute everything from scratch
    function recomputeAll() {
      semesters.forEach(recomputeSemester);
    }

    function render() {
      const container = document.getElementById('semesterContainer');
      container.innerHTML = '';

      // Re-index semesters so labels stay correct
      semesters.forEach((sem, i) => { sem.index = i + 1; });

      recomputeAll();

      const grandCredits = semesters.reduce((sum, s) => sum + s.totalCredits, 0);
      const grandPoints = semesters.reduce((sum, s) => sum + s.totalPoints, 0);
      const cgpa = grandCredits > 0 ? (grandPoints / grandCredits).toFixed(2) : '-';

      document.getElementById('totalCredits').textContent = grandCredits || 0;
      document.getElementById('totalCreditsSub').textContent = grandCredits ? 'credit(s)' : '—';
      document.getElementById('cgpaDisplay').textContent = cgpa;
      document.getElementById('cgpaSub').textContent = grandCredits ? 'GPA · 5.0 scale' : 'Add courses to start';

      // "Credits This Semester" = first semester's credits (if any)
      const firstSemCredits = semesters[0]?.totalCredits || 0;
      document.getElementById('creditsThisSem').textContent = firstSemCredits;
      document.getElementById('creditsSub').textContent = firstSemCredits ? 'credit(s)' : '—';

      // Build semester cards
      semesters.forEach((sem, si) => {
        const div = document.createElement('div');
        div.className = 'semester';

        // header
        const header = document.createElement('div');
        header.className = 'semester-header';
        const label = document.createElement('span');
        label.className = 'semester-label';
        label.textContent = `Semester ${sem.index}`;
        const delBtn = document.createElement('button');
        delBtn.className = 'del-semester-btn';
        delBtn.textContent = '× Delete Semester';
        delBtn.onclick = () => { semesters.splice(si, 1); render(); };
        header.appendChild(label);
        header.appendChild(delBtn);
        div.appendChild(header);

        // grade scale hint
        const scale = document.createElement('div');
        scale.className = 'grade-scale';
        ['A','B','C','D','E','F'].forEach(g => {
          const span = document.createElement('span');
          span.innerHTML = `<span class="grade-point">${g}</span> = ${GRADE_POINTS[g].toFixed(1)}`;
          scale.appendChild(span);
        });
        div.appendChild(scale);

        // table
        const table = document.createElement('table');
        const thead = document.createElement('thead');
        thead.innerHTML = `<tr><th>Course Name</th><th>Credits</th><th>Grade</th><th></th></tr>`;
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        sem.courses.forEach((c, ci) => {
          const tr = document.createElement('tr');

          const tdName = document.createElement('td');
          const nameInput = document.createElement('input');
          nameInput.type = 'text'; nameInput.placeholder = 'Course name';
          nameInput.value = c.courseName || '';
          nameInput.oninput = () => c.courseName = nameInput.value;
          tdName.appendChild(nameInput);

          const tdCredits = document.createElement('td');
          const creditsInput = document.createElement('input');
          creditsInput.type = 'number'; creditsInput.min = '0'; creditsInput.step = '0.5';
          creditsInput.value = c.credits || 0;
          creditsInput.oninput = () => {
            c.credits = isNaN(parseFloat(creditsInput.value)) ? 0 : parseFloat(creditsInput.value);
            render();
          };
          tdCredits.appendChild(creditsInput);

          const tdGrade = document.createElement('td');
          const gradeSelect = document.createElement('select');
          ['A','B','C','D','E','F'].forEach(g => {
            const opt = document.createElement('option');
            opt.value = g; opt.textContent = g;
            if (c.grade) opt.selected = c.grade === g;
            gradeSelect.appendChild(opt);
          });
          gradeSelect.onchange = () => { c.grade = gradeSelect.value; render(); };
          tdGrade.appendChild(gradeSelect);

          const tdDel = document.createElement('td');
          const delBtn2 = document.createElement('button');
          delBtn2.className = 'delete-course';
          delBtn2.innerHTML = '&times;';
          delBtn2.onclick = () => { sem.courses.splice(ci, 1); render(); };
          tdDel.appendChild(delBtn2);

          tr.appendChild(tdName);
          tr.appendChild(tdCredits);
          tr.appendChild(tdGrade);
          tr.appendChild(tdDel);
          tbody.appendChild(tr);
        });

        // total row
        const totalRow = document.createElement('tr');
        totalRow.style.fontWeight = '700';
        totalRow.innerHTML = `<td colspan="2">Credit Total</td><td colspan="2">${sem.totalCredits || 0} credit(s)</td>`;
        tbody.appendChild(totalRow);

        table.appendChild(tbody);
        div.appendChild(table);

        // + Add Course button
        const addBtn = document.createElement('button');
        addBtn.className = 'add-course-btn';
        addBtn.textContent = '+ Add Course';
        addBtn.onclick = () => addCourse(si);
        div.appendChild(addBtn);

        container.appendChild(div);
      });
    }

    function addSemester() {
      semesters.push({
        id: uid(),
        index: semesters.length + 1,
        courses: []
      });
      render();
    }

    function addCourse(semIndex) {
      semesters[semIndex].courses.push({ courseName: '', credits: 0, grade: 'A' });
      render();
    }

    // Initial state: one empty semester
    addSemester();
    render();
  </script>
</body>
</html>
